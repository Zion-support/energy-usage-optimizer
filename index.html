<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Energy Usage Optimizer</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:130px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>⚡ Energy Usage Optimizer</h1><p>Estimate energy savings for your facility or data center.</p><label>Monthly energy bill ($): <input id="b" type="number" value="20000"></label> <label>kWh/month: <input id="k" type="number" value="150000"></label> <button onclick="go()">Analyze</button><div id="out"></div><script>function go(){const b=+document.getElementById('b').value,k=+document.getElementById('k').value;const rate=(b/k).toFixed(3);const peak=Math.round(b*0.12),hvac=Math.round(b*0.09),led=Math.round(b*0.04);document.getElementById('out').textContent=`Effective rate: $${rate}/kWh\nSavings opportunities:\n• Peak-load shifting: ~$${peak.toLocaleString()}/mo\n• Cooling/HVAC optimization: ~$${hvac.toLocaleString()}/mo\n• Lighting & standby: ~$${led.toLocaleString()}/mo\nTotal: ~$${(peak+hvac+led).toLocaleString()}/mo (${Math.round((peak+hvac+led)/b*100)}%)\nCarbon reduction: ~${Math.round(k*0.25*0.0004)} tCO2/mo\n\nFull energy audit with IoT sensors: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/energy-usage-optimizer">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-energy-sentinel/">Energy Sentinel</a></p></body></html>
